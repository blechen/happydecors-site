# Déploiement Netlify — site statique Happy Décors (aucune compilation)
[build]
  publish = "."
  command = ""

# Sécurité / cache de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Visuels et vidéos : cache 30 jours (pas « immutable » : une photo remplacée doit pouvoir se mettre à jour)
[[headers]]
  for = "/assets/decors/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Anciennes adresses du site WordPress (avant juin 2026) → sections du nouveau site
[[redirects]]
  from = "/contactez-nous"
  to = "/#contact"
  status = 301

[[redirects]]
  from = "/contactez-nous/*"
  to = "/#contact"
  status = 301

