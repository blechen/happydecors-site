<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merci ! — Happy Décors</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    .thanks { min-height: 80vh; display: grid; place-items: center; text-align: center; padding: 40px 24px; }
    .thanks-card { max-width: 540px; }
    .thanks-emoji { font-size: 4rem; }
    .thanks h1 { font-size: clamp(2.2rem, 6vw, 3.4rem); margin: 10px 0 14px; }
    .thanks p { color: var(--ink-soft); font-size: 1.15rem; margin-bottom: 28px; }
  </style>
</head>
<body>
  <section class="thanks">
    <div class="thanks-card">
      <div class="blob blob-1" aria-hidden="true" style="opacity:.4"></div>
      <div class="thanks-emoji">🎉</div>
      <h1>Merci, c'est noté&nbsp;!</h1>
      <p>Votre demande nous est bien parvenue. On regarde ce qu'on a pour votre événement et on revient vers vous très vite.</p>
      <a class="btn btn-primary btn-lg" href="index.html#catalogue">← Revenir aux décors</a>
    </div>
  </section>
</body>
</html>
